<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090914"><title>NR AI</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#090914;--panel:#141427;--panel2:#1c1c35;--text:#f5f3ff;--muted:#aaa8c5;--line:#2c2948;--a:#9b70ff;--b:#5ee7df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25164b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Arial}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:22px 15px;border-right:1px solid var(--line);background:#0c0c19}.brand{font-size:26px;font-weight:900;margin:0 10px}.tag{color:var(--muted);font-size:12px;margin:0 10px 24px}.nav{display:grid;gap:6px}.nav button{border:0;background:none;color:var(--muted);padding:11px;border-radius:12px;text-align:left;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:linear-gradient(100deg,#38235f,#1d2944);color:white}.foot{position:absolute;bottom:18px;color:#77758f;font-size:11px;padding:0 10px}main{max-width:1100px;width:100%;padding:26px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.status{border:1px solid var(--line);border-radius:30px;padding:7px 12px;color:var(--b);font-size:12px}h1{font-size:clamp(29px,4vw,43px);line-height:1.12;margin:10px 0}.sub,.hint{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:23px 0}.card,.panel{background:linear-gradient(145deg,#19192f,#111120);border:1px solid var(--line);border-radius:17px;padding:18px}.card{cursor:pointer}.card:hover{border-color:#8262ce;transform:translateY(-2px)}.ico{font-size:26px}.card h3{margin:8px 0 3px}.card p{margin:0;color:var(--muted);font-size:13px}textarea,input,select{width:100%;background:#0b0b18;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.row>*{flex:1;min-width:125px}button.primary{background:linear-gradient(100deg,#9665ff,#5a8dff);border:0;color:white;padding:12px 17px;border-radius:11px;font-weight:700;cursor:pointer}button.secondary{background:#24243e;color:white;border:1px solid var(--line);padding:11px 14px;border-radius:11px;cursor:pointer}.log{height:320px;overflow:auto;background:#0b0b18;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}.bubble{padding:10px 12px;border-radius:12px;margin:7px 0;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#38265e;margin-left:auto}.bot{background:#1d1d35}.out{margin-top:14px;padding:13px;background:#0b0b18;border:1px dashed #514675;border-radius:11px;white-space:pre-wrap;color:#d5d0ef}.notice{margin-top:14px;background:#29213d;color:#ded1ff;border-radius:11px;padding:12px;font-size:12px}.muted{color:var(--muted);font-size:13px}footer{color:#77758f;font-size:11px;margin:22px 0}
@media(max-width:780px){.layout{display:block}.side{position:relative;padding:13px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:inline-block}.tag{display:inline-block;margin:0 0 0 8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.foot{display:none}main{padding:18px 13px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:8px;flex-direction:column}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">NR <span style="color:var(--a)">AI</span></div><div class="tag">Your All-in-One AI</div><nav class="nav" id="nav"><button class="active" data-page="home">⌂ Beranda</button><button data-page="chat">✦ AI Chat</button><button data-page="video">▶ AI Video</button><button data-page="image">▧ AI Gambar</button><button data-page="music">♫ AI Musik</button><button data-page="voice">◖ AI Suara</button><button data-page="tools">✧ Tools</button></nav><div class="foot">NR AI • v0.2</div></aside><main><div class="top"><div><div class="muted">STUDIO KREATIF AI</div><strong>Selamat datang di NR AI</strong></div><div style="display:flex;gap:8px;align-items:center"><button class="secondary" id="settingsBtn" style="padding:7px 10px">⚙ Server</button><span class="status" id="apiStatus">● Memeriksa server…</span></div></div><section id="content"></section><footer>NR AI • Gunakan model dan layanan sesuai lisensinya. Jangan masukkan data rahasia.</footer></main></div>
<script>
const templates={
home:`<h1>Satu tempat untuk<br><span style="color:#b99aff">semua kreativitas AI.</span></h1><p class="sub">Pusat kreativitas untuk chat, video, gambar, musik, dan suara.</p><div class="grid"><div class="card" data-go="chat"><div class="ico">✦</div><h3>AI Chat</h3><p>Asisten AI melalui server lokal.</p></div><div class="card" data-go="video"><div class="ico">▶</div><h3>AI Video</h3><p>Rancang prompt dan format video.</p></div><div class="card" data-go="image"><div class="ico">▧</div><h3>AI Gambar</h3><p>Rancang prompt gambar.</p></div><div class="card" data-go="music"><div class="ico">♫</div><h3>AI Musik</h3><p>Rancang konsep musik.</p></div><div class="card" data-go="voice"><div class="ico">◖</div><h3>AI Suara</h3><p>Bacakan teks dengan browser.</p></div><div class="card" data-go="tools"><div class="ico">✧</div><h3>Tools lainnya</h3><p>Tempat fitur lanjutan.</p></div></div><div class="panel"><h2>Mulai menggunakan NR AI</h2><p class="hint">Jalankan backend lokal sesuai panduan README untuk mengaktifkan AI Chat.</p><div class="notice">Chat dapat memakai Ollama di komputer/server sendiri tanpa biaya API. Pembuatan media tetap memerlukan model khusus dan perangkat komputasi yang sesuai.</div></div>`,
chat:`<h1>AI Chat</h1><p class="sub">Chat dengan model AI yang berjalan melalui backend NR AI.</p><div class="panel"><div class="log" id="log"><div class="bubble bot">Halo! Saya NR AI. Hubungkan backend dan model Ollama untuk mulai percakapan.</div></div><textarea id="message" style="min-height:75px" placeholder="Tulis pertanyaanmu…"></textarea><div class="row"><button class="primary" id="send">Kirim pesan</button><button class="secondary" id="clear">Hapus chat</button></div><div class="muted" id="chatState">Riwayat chat disimpan di perangkat ini. Respons AI membutuhkan backend aktif.</div></div>`,
video:`<h1>AI Video Generator</h1><p class="sub">Susun prompt video dengan format untuk platform pilihan.</p><div class="panel"><textarea id="prompt" placeholder="Contoh: Kota futuristik saat hujan malam, mobil melaju, kamera sinematik, realistis…"></textarea><div class="row"><select id="ratio"><option>9:16 — TikTok/Reels</option><option>16:9 — YouTube</option><option>1:1 — Instagram</option></select><select id="duration"><option>5 detik</option><option>10 detik</option><option>15 detik</option><option>30 detik</option></select><select id="quality"><option>HD</option><option>Full HD</option><option>4K (jika didukung)</option></select></div><div class="row"><button class="primary" id="make">Susun prompt</button><button class="secondary" id="copyPrompt">Salin prompt</button></div><div class="out" id="result">Prompt video akan muncul di sini.</div><div class="notice">Render video MP4 belum terhubung. Diperlukan backend video, model text-to-video, dan GPU yang memadai.</div></div>`,
image:`<h1>AI Image Generator</h1><p class="sub">Rancang prompt gambar sesuai gaya dan rasio.</p><div class="panel"><textarea id="prompt" placeholder="Deskripsikan gambar yang ingin dibuat…"></textarea><div class="row"><select id="ratio"><option>1:1</option><option>9:16</option><option>16:9</option></select><select id="style"><option>Fotorealistis</option><option>Anime</option><option>3D</option><option>Ilustrasi</option></select></div><div class="row"><button class="primary" id="make">Susun prompt</button><button class="secondary" id="copyPrompt">Salin prompt</button></div><div class="out" id="result">Prompt gambar akan muncul di sini.</div><div class="notice">Generasi file gambar memerlukan model text-to-image dan backend yang terhubung.</div></div>`,
music:`<h1>AI Music Generator</h1><p class="sub">Rancang konsep musik, genre, dan durasi.</p><div class="panel"><textarea id="prompt" placeholder="Contoh: Musik pop penuh semangat tentang mengejar mimpi…"></textarea><div class="row"><select id="genre"><option>Pop</option><option>EDM</option><option>Cinematic</option><option>Rock</option><option>Lo-fi</option><option>Instrumental</option></select><select id="duration"><option>30 detik</option><option>1 menit</option><option>2 menit</option><option>3 menit</option></select></div><div class="row"><button class="primary" id="make">Susun deskripsi musik</button><button class="secondary" id="copyPrompt">Salin deskripsi</button></div><div class="out" id="result">Deskripsi musik akan muncul di sini.</div><div class="notice">Generasi audio musik memerlukan model text-to-music dan komputasi yang sesuai.</div></div>`,
voice:`<h1>AI Voice Studio</h1><p class="sub">Bacakan teks menggunakan fitur suara perangkat.</p><div class="panel"><textarea id="script" placeholder="Masukkan teks narasi…"></textarea><div class="row"><select id="rate"><option value="1">Normal</option><option value=".85">Lambat</option><option value="1.15">Cepat</option></select><button class="primary" id="speak">▶ Bacakan</button><button class="secondary" id="stop">Hentikan</button></div><div class="notice">Memakai text-to-speech bawaan browser/perangkat jika tersedia.</div></div>`,
tools:`<h1>Tools lainnya</h1><p class="sub">Ruang pengembangan fitur NR AI berikutnya.</p><div class="grid">${[['⌘','AI Coding','Bantuan menulis kode'],['文','Translator','Terjemahan bahasa'],['✎','Story Maker','Cerita dan naskah'],['▣','Thumbnail Maker','Konsep thumbnail'],['◉','Photo Editor','Edit foto AI'],['▤','Subtitle Maker','Subtitle otomatis']].map(x=>`<div class="card"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`
};
function show(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('content').innerHTML=templates[p]||templates.home;wire(p)}
document.getElementById('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};
document.getElementById('content').onclick=e=>{let c=e.target.closest('[data-go]');if(c)show(c.dataset.go)};
function apiBase(){return (localStorage.getItem('nr_api_base')||'').trim().replace(/\/+$/,'')}
function apiUrl(path){return apiBase()+path}
function saveChat(){const log=document.getElementById('log');if(log)localStorage.setItem('nr_chat_history',log.innerHTML)}
function loadChat(){const log=document.getElementById('log');if(!log)return;const saved=localStorage.getItem('nr_chat_history');if(saved)log.innerHTML=saved}
function wire(p){
if(p==='chat'){
 const log=document.getElementById('log'),msg=document.getElementById('message'),state=document.getElementById('chatState');
 loadChat();
 document.getElementById('clear').onclick=()=>{log.innerHTML='';localStorage.removeItem('nr_chat_history')};
 document.getElementById('send').onclick=async()=>{
  let text=msg.value.trim();if(!text)return;
  let u=document.createElement('div');u.className='bubble user';u.textContent=text;log.appendChild(u);msg.value='';
  let wait=document.createElement('div');wait.className='bubble bot';wait.textContent='NR AI sedang berpikir…';log.appendChild(wait);saveChat();log.scrollTop=log.scrollHeight;
  try{
   let r=await fetch(apiUrl('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
   let data=await r.json();if(!r.ok)throw Error(data.detail||'Server error');
   wait.textContent=data.reply;state.textContent='Terhubung ke backend NR AI.';saveChat();
  }catch(err){wait.textContent='Belum dapat menghubungi AI. Atur alamat backend melalui tombol Server. Detail: '+err.message;state.textContent='Backend belum terhubung.';saveChat()}
  log.scrollTop=log.scrollHeight;
 };
}
if(['video','image','music'].includes(p)){
 document.getElementById('make').onclick=()=>{
  let v=document.getElementById('prompt').value.trim();
  document.getElementById('result').textContent=v?'PROMPT: '+v+'\nPENGATURAN: '+[...document.querySelectorAll('select')].map(x=>x.value).join(' • ')+'\n\nPrompt siap digunakan pada model generator yang sesuai.':'Masukkan deskripsi terlebih dahulu.';
 };
 document.getElementById('copyPrompt').onclick=async()=>{
  let v=document.getElementById('result').textContent;
  try{await navigator.clipboard.writeText(v);alert('Prompt disalin.')}catch{alert('Tidak bisa menyalin otomatis. Tekan lama teks hasil untuk menyalin.')}
 };
}
if(p==='voice'){
 document.getElementById('speak').onclick=()=>{let t=document.getElementById('script').value;if(!t)return;if(!window.speechSynthesis){alert('Browser tidak mendukung text-to-speech');return}let u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=+document.getElementById('rate').value;speechSynthesis.speak(u)};
 document.getElementById('stop').onclick=()=>speechSynthesis.cancel();
}
}
async function check(){try{let r=await fetch(apiUrl('/api/health'));let d=await r.json();document.getElementById('apiStatus').textContent=d.ollama?'● AI Chat siap':'● Backend aktif, model belum siap'}catch{document.getElementById('apiStatus').textContent='● Demo / backend offline'}}
document.getElementById('settingsBtn').onclick=()=>{
 const current=localStorage.getItem('nr_api_base')||'';
 const value=prompt('Alamat backend NR AI. Kosongkan jika website dan backend berada di alamat yang sama. Contoh: http://192.168.1.10:8000',current);
 if(value!==null){localStorage.setItem('nr_api_base',value.trim().replace(/\\/$/,''));check();alert('Alamat server disimpan di perangkat ini.')}
};
show('home');check();
</script></body></html>
