services:
  ollama:
    image: ollama/ollama:latest
    container_name: nr-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
  nr-ai:
    build: .
    container_name: nr-ai-app
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama_data:
