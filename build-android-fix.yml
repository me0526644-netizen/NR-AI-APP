name: NR AI APK FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Replace TypeScript config
        run: |
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nrai.app",
            "appName": "NR AI",
            "webDir": "static"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NR-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
