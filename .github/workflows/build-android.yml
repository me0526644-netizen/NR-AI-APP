name: NR AI APK - Explicit JSON Config

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create JSON Capacitor config and verify
        run: |
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.mjs
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nrai.app",
            "appName": "NR AI",
            "webDir": "static"
          }
          EOF
          echo "---- Capacitor config files ----"
          ls -la capacitor.config.*
          test ! -f capacitor.config.ts

      - name: Add Android platform using JSON config explicitly
        run: npx cap add android

      - name: Sync Android using JSON config explicitly
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NR-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
